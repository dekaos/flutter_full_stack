<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" width="1240" height="760" role="img" aria-label="The Flutter app is MVVM. The presentation folder holds the View, plain widgets that render state. The providers folder holds the ViewModel, a Riverpod controller that owns an AsyncValue and exposes commands. The Model layer is the generated client package, which is never hand-edited. Alongside them, lib/app wires the MaterialApp and the router, and lib/core/providers owns the single Serverpod client for the whole app.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1E"/>
      <stop offset="1" stop-color="#0F1830"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#56C8F5" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#56C8F5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowEmerald" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <marker id="aEmerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34D399"/>
    </marker>
    <marker id="aCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#56C8F5"/>
    </marker>
    <marker id="aViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A78BFA"/>
    </marker>
  </defs>

  <rect width="1240" height="760" fill="url(#bg)"/>
  <ellipse cx="300" cy="200" rx="300" ry="190" fill="url(#glowEmerald)"/>
  <ellipse cx="300" cy="560" rx="300" ry="190" fill="url(#glowViolet)"/>
  <ellipse cx="1000" cy="380" rx="280" ry="220" fill="url(#glowCyan)"/>

  <text x="44" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="700" fill="#E6EDF3">The Flutter layer, folder by folder</text>
  <text x="44" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8FA0BC">MVVM. A folder per role: the widget renders, the controller holds the state, and the Model is the generated client — no repository in between.</text>

  <!-- ══ VIEW ══════════════════════════════════════════════════════ -->
  <rect x="44" y="104" width="720" height="140" rx="14" fill="#111A2E" stroke="#1E2A45"/>
  <rect x="44" y="104" width="4" height="140" rx="2" fill="#34D399"/>
  <text x="70" y="130" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.6" fill="#61708C">VIEW</text>
  <text x="150" y="130" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#6FB89A">lib/features/&lt;feature&gt;/presentation/</text>

  <rect x="70" y="144" width="300" height="34" rx="8" fill="#17223A" stroke="#2A3A5E"/>
  <rect x="70" y="144" width="3" height="34" rx="1.5" fill="#34D399"/>
  <text x="86" y="166" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#E6EDF3">greetings_screen.dart</text>

  <text x="392" y="159" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#9FB2CE">A ConsumerWidget. Owns no state of its own:</text>
  <text x="392" y="176" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#9FB2CE">it watches, then draws one of four states.</text>

  <text x="70" y="204" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#61708C">Put a widget here only if it draws. Anything that decides belongs one layer down.</text>
  <text x="70" y="226" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#61708C">No `setState` for server data, no `Future` stored in a field, no business rules.</text>

  <!-- arrows View <-> ViewModel -->
  <line x1="150" y1="248" x2="150" y2="292" stroke="#56C8F5" stroke-width="1.6" marker-end="url(#aCyan)"/>
  <text x="166" y="265" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#56C8F5">ref.read(...notifier).sayHello()</text>
  <text x="166" y="281" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#61708C">a command going down</text>

  <line x1="722" y1="292" x2="722" y2="248" stroke="#34D399" stroke-width="1.6" marker-end="url(#aEmerald)"/>
  <text x="706" y="265" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#34D399">ref.watch(...) → AsyncValue</text>
  <text x="706" y="281" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#61708C">state coming back up</text>

  <!-- ══ VIEWMODEL ═════════════════════════════════════════════════ -->
  <rect x="44" y="296" width="720" height="150" rx="14" fill="#111A2E" stroke="#1E2A45"/>
  <rect x="44" y="296" width="4" height="150" rx="2" fill="#34D399"/>
  <text x="70" y="322" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.6" fill="#61708C">VIEW MODEL</text>
  <text x="190" y="322" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#6FB89A">lib/features/&lt;feature&gt;/providers/</text>

  <rect x="70" y="336" width="300" height="34" rx="8" fill="#17223A" stroke="#2A3A5E"/>
  <rect x="70" y="336" width="3" height="34" rx="1.5" fill="#34D399"/>
  <text x="86" y="358" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#E6EDF3">greeting_controller.dart</text>

  <rect x="70" y="376" width="300" height="30" rx="8" fill="#141D33" stroke="#252F4D" stroke-dasharray="3 3"/>
  <rect x="70" y="376" width="3" height="30" rx="1.5" fill="#A78BFA"/>
  <text x="86" y="395" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#8B7FB8">greeting_controller.g.dart</text>

  <text x="392" y="351" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#9FB2CE">The `@riverpod` class. Holds the state as one</text>
  <text x="392" y="368" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#9FB2CE">`AsyncValue&lt;Greeting?&gt;` and exposes commands.</text>
  <text x="392" y="393" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#61708C">The `.g.dart` twin is generated — never edit it.</text>

  <text x="70" y="428" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#61708C">This is the seam a widget test overrides, which is why the widget stays dumb.</text>

  <!-- arrow ViewModel -> Model -->
  <line x1="404" y1="450" x2="404" y2="494" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#aViolet)"/>
  <text x="418" y="476" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#A78BFA">await client.greeting.hello(name)</text>

  <!-- ══ MODEL ═════════════════════════════════════════════════════ -->
  <rect x="44" y="498" width="720" height="140" rx="14" fill="#111A2E" stroke="#1E2A45"/>
  <rect x="44" y="498" width="4" height="140" rx="2" fill="#A78BFA"/>
  <text x="70" y="524" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.6" fill="#61708C">MODEL</text>
  <text x="150" y="524" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#8B7FB8">flutter_full_stack_client — a separate package</text>

  <rect x="70" y="538" width="300" height="34" rx="8" fill="#141D33" stroke="#252F4D" stroke-dasharray="3 3"/>
  <rect x="70" y="538" width="3" height="34" rx="1.5" fill="#A78BFA"/>
  <text x="86" y="560" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#8B7FB8">Greeting, Client, endpoints</text>

  <text x="392" y="553" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#9FB2CE">Generated from the server's `.spy.yaml` and</text>
  <text x="392" y="570" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#9FB2CE">endpoint classes by `melos run generate`.</text>

  <text x="70" y="598" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#61708C">There is no repository and no DTO-to-entity mapping: the generated types are</text>
  <text x="70" y="620" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#61708C">already typed Dart, so a layer that only forwards calls would earn nothing.</text>

  <!-- ══ right column ══════════════════════════════════════════════ -->
  <rect x="792" y="104" width="404" height="242" rx="14" fill="#111A2E" stroke="#1E2A45"/>
  <rect x="792" y="104" width="4" height="242" rx="2" fill="#56C8F5"/>
  <text x="818" y="130" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.6" fill="#61708C">COMPOSITION ROOT</text>
  <text x="818" y="150" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#7FB6D8">lib/app/</text>

  <rect x="818" y="164" width="352" height="34" rx="8" fill="#17223A" stroke="#2A3A5E"/>
  <rect x="818" y="164" width="3" height="34" rx="1.5" fill="#56C8F5"/>
  <text x="834" y="186" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#E6EDF3">app.dart</text>
  <text x="1156" y="186" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#61708C">MaterialApp.router + theme</text>

  <rect x="818" y="208" width="352" height="34" rx="8" fill="#17223A" stroke="#2A3A5E"/>
  <rect x="818" y="208" width="3" height="34" rx="1.5" fill="#56C8F5"/>
  <text x="834" y="230" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#E6EDF3">router.dart</text>
  <text x="1156" y="230" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#61708C">every GoRoute, keepAlive</text>

  <text x="818" y="272" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#61708C">Not a feature. This is where the app is</text>
  <text x="818" y="291" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#61708C">assembled and where every route is</text>
  <text x="818" y="310" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#61708C">declared, so navigation is readable in</text>
  <text x="818" y="329" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#61708C">one file instead of scattered.</text>

  <rect x="792" y="366" width="404" height="272" rx="14" fill="#111A2E" stroke="#1E2A45"/>
  <rect x="792" y="366" width="4" height="272" rx="2" fill="#56C8F5"/>
  <text x="818" y="392" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.6" fill="#61708C">SHARED PLUMBING</text>
  <text x="818" y="412" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#7FB6D8">lib/core/providers/</text>

  <rect x="818" y="426" width="352" height="34" rx="8" fill="#17223A" stroke="#2A3A5E"/>
  <rect x="818" y="426" width="3" height="34" rx="1.5" fill="#56C8F5"/>
  <text x="834" y="448" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#E6EDF3">serverpod_client.dart</text>

  <text x="818" y="486" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#9FB2CE">One `Client` for the whole app, built once</text>
  <text x="818" y="505" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#9FB2CE">and kept alive. Before it yields it has:</text>
  <text x="834" y="530" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#61708C">· resolved the server URL</text>
  <text x="834" y="549" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#61708C">· restored the saved auth session</text>
  <text x="834" y="568" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#61708C">· attached the connectivity monitor</text>
  <text x="818" y="598" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#61708C">That work is why the provider is a Future,</text>
  <text x="818" y="617" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#61708C">and why controllers `await ...future`.</text>

  <!-- ══ legend ════════════════════════════════════════════════════ -->
  <rect x="44" y="668" width="1152" height="52" rx="12" fill="#0E1526" stroke="#1B2540"/>
  <rect x="70" y="686" width="14" height="16" rx="4" fill="#17223A" stroke="#2A3A5E"/>
  <rect x="70" y="686" width="3" height="16" rx="1.5" fill="#34D399"/>
  <text x="94" y="699" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#9FB2CE">you write this</text>

  <rect x="212" y="686" width="14" height="16" rx="4" fill="#141D33" stroke="#252F4D" stroke-dasharray="3 3"/>
  <rect x="212" y="686" width="3" height="16" rx="1.5" fill="#A78BFA"/>
  <text x="236" y="699" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#9FB2CE">generated — never hand-edit</text>

  <text x="470" y="699" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#61708C">A feature owns two folders and nothing else. Everything shared is already on the right.</text>
</svg>
