# Shared lint configuration for every package in this monorepo.
#
# Each package's own analysis_options.yaml includes this file and adds only the
# excludes that are specific to it. Change lint rules HERE so the three packages
# can never drift apart.
include: package:very_good_analysis/analysis_options.11.0.0.yaml

linter:
  rules:
    # This is an application monorepo, not a published package, so public
    # members do not need dartdoc.
    public_member_api_docs: false

    # Fire-and-forget futures must be made explicit with `unawaited(...)`.
    unawaited_futures: true

    # Dart 3.13 lets a constructor be declared as `new(...)` instead of
    # repeating the class name. It is valid, but unfamiliar to read - notably in
    # Flutter widgets, where `const MyWidget({super.key})` is the idiom everyone
    # recognises. Keep the conventional form.
    unnecessary_type_name_in_constructor: false

    # Would rewrite `class Foo extends Bar {}` as `class Foo extends Bar;`.
    # That is valid Dart 3.13, but the analyzer bundled with serverpod_cli
    # 4.0.0-rc.2 still cannot parse it: `serverpod generate` fails with
    # "Endpoint analysis skipped due to invalid Dart syntax" and asks for the
    # experimental 'primary-constructors' feature. Our empty endpoint
    # subclasses in lib/src/auth/ hit exactly this. Re-verified on 4.0.0-rc.2;
    # revisit when the Serverpod CLI ships a newer analyzer.
    empty_container_bodies: false

formatter:
  trailing_commas: preserve
