name: flutter_full_stack
publish_to: none

environment:
  sdk: '^3.13.0'

workspace:
  - flutter_full_stack_client
  - flutter_full_stack_server
  - flutter_full_stack_flutter

dev_dependencies:
  melos: ^8.6.0
  # Referenced by the shared analysis_options.yaml at the repo root.
  very_good_analysis: 11.0.0

melos:
  name: flutter_full_stack
  packages:
    - flutter_full_stack_client
    - flutter_full_stack_server
    - flutter_full_stack_flutter

  scripts:
    # ---------------------------------------------------------------- setup --
    setup:
      description: Install all workspace dependencies.
      exec: dart pub get

    # -------------------------------------------------------------- codegen --
    generate:server:
      description: Run Serverpod code generation (server + client).
      exec: serverpod generate
      packageFilters:
        scope: flutter_full_stack_server

    generate:flutter:
      description: Run build_runner for the Flutter app (Riverpod, go_router).
      # No --delete-conflicting-outputs: this build_runner prints
      # "These options have been removed and were ignored" for it on every run.
      exec: dart run build_runner build
      packageFilters:
        scope: flutter_full_stack_flutter

    generate:watch:
      description: >-
        Regenerate the app's *.g.dart files on every save. A new @riverpod class
        cannot compile before its .g.dart exists, so the analyzer reports
        `_$Foo` undefined until then; leave this running while writing
        controllers and it clears itself a second after each save. Ctrl-C to
        stop. It only covers the Flutter package - use `melos run generate` for
        a full pass, including the Serverpod generator and formatting.
      exec: dart run build_runner watch
      packageFilters:
        scope: flutter_full_stack_flutter

    generate:
      description: Regenerate every piece of generated code in the monorepo.
      # `serverpod generate` and `build_runner` emit code that does not satisfy
      # `dart format` on this language version, so formatting is part of the
      # step. Always use this script instead of calling the generators directly,
      # otherwise `melos run format:check` will fail in CI.
      run: |
        dart run melos:melos run generate:server --no-select &&
        dart run melos:melos run generate:flutter --no-select &&
        dart run melos:melos run format --no-select

    # --------------------------------------------------------------- server --
    server:start:
      description: Start Docker services and the Serverpod server with migrations.
      # The port check runs first on purpose. Serverpod does not exit when it
      # fails to bind - it logs the error, stays alive and stops answering
      # SIGTERM - so without this a second start silently piles up processes
      # that have to be killed with -9. See tool/require_free_ports.dart.
      exec: dart run ../tool/require_free_ports.dart 8080 8081 8082 && docker compose --progress quiet up --detach && dart bin/main.dart --apply-migrations
      packageFilters:
        scope: flutter_full_stack_server

    server:debug:
      description: >-
        Like server:start, but exposes the Dart VM service on 127.0.0.1:8181 so
        a debugger can attach - use the "Attach to the running server" launch
        configuration in VS Code. Local development only: the service is
        unauthenticated, which is why it binds to loopback and never to 0.0.0.0.
      # 8181 is checked too: the VM service is served by a separate DDS
      # process which outlives a failed server and keeps holding the port.
      exec: dart run ../tool/require_free_ports.dart 8080 8081 8082 8181 && docker compose --progress quiet up --detach && dart run --observe=8181 --disable-service-auth-codes bin/main.dart --apply-migrations
      packageFilters:
        scope: flutter_full_stack_server

    server:stop:
      description: Stop Docker services.
      exec: docker compose down
      packageFilters:
        scope: flutter_full_stack_server

    docker:up:
      description: Start the Postgres/Redis containers only (dev + test).
      exec: docker compose --progress quiet up --detach
      packageFilters:
        scope: flutter_full_stack_server

    docker:down:
      description: Stop the containers and drop their volumes.
      exec: docker compose down --volumes
      packageFilters:
        scope: flutter_full_stack_server

    # --------------------------------------------------------------- format --
    format:
      description: Format every package in the monorepo.
      exec: dart format .

    format:check:
      description: Fail if any file is not formatted.
      exec: dart format --output=none --set-exit-if-changed .

    # -------------------------------------------------------------- analyze --
    analyze:dart:
      description: Analyze pure Dart packages (server, client).
      exec: dart analyze --fatal-infos .
      packageFilters:
        flutter: false

    analyze:flutter:
      description: Analyze the Flutter app.
      exec: flutter analyze --fatal-infos
      packageFilters:
        flutter: true

    analyze:
      description: Analyze every package in the monorepo.
      run: |
        dart run melos:melos run analyze:dart --no-select &&
        dart run melos:melos run analyze:flutter --no-select

    # ----------------------------------------------------------------- test --
    test:dart:
      description: Run pure Dart package tests (requires `melos run docker:up`).
      exec: dart test
      packageFilters:
        flutter: false
        dirExists: test

    test:flutter:
      description: Run Flutter app tests.
      exec: flutter test
      packageFilters:
        flutter: true
        dirExists: test

    test:
      description: Run every test in the monorepo.
      run: |
        dart run melos:melos run test:dart --no-select &&
        dart run melos:melos run test:flutter --no-select

    test:e2e:
      description: >-
        End-to-end tests - the real app driven against a running server. Not
        part of `test` or `check`: it needs the stack up
        (`melos run server:start`) and a booted Android emulator or iOS
        simulator. Web is a build target but not a test one: integration_test
        does not run there, and the desktop targets are gone. E2E_DEVICE picks
        the device id when more than one is attached; left unset, Flutter uses
        the only one it finds. E2E_SERVER_URL picks the backend.
      exec: flutter test integration_test ${E2E_DEVICE:+-d $E2E_DEVICE} --dart-define=SERVER_URL=${E2E_SERVER_URL:-http://localhost:8080/}
      packageFilters:
        scope: flutter_full_stack_flutter

    # ----------------------------------------------------------------- size --
    size:measure:
      description: Build the release APK whose size the budget gates.
      exec: flutter build apk --release --target-platform android-arm64
      packageFilters:
        scope: flutter_full_stack_flutter

    size:
      description: >-
        Build and fail if the APK grew past tool/size_budget.json. The one
        performance-adjacent number with no noise in it: same source, same
        bytes, on any runner.
      run: |
        dart run melos:melos run size:measure --no-select &&
        dart run tool/size_budget.dart

    size:budget:
      description: Build, then record the current size as the budget.
      run: |
        dart run melos:melos run size:measure --no-select &&
        dart run tool/size_budget.dart --update

    # ------------------------------------------------------------- coverage --
    coverage:measure:
      description: Run the Flutter tests with coverage, writing coverage/lcov.info.
      exec: flutter test --coverage
      packageFilters:
        scope: flutter_full_stack_flutter

    coverage:
      description: >-
        Measure line coverage and fail if it dropped below the ratchet in
        tool/coverage_floor.json. Generated code is excluded: counting it
        measures the generators, not this repo.
      run: |
        dart run melos:melos run coverage:measure --no-select &&
        dart run tool/coverage_floor.dart

    coverage:floor:
      description: >-
        Measure, then raise the ratchet to what was measured. It refuses to
        lower it - a ratchet that can be loosened is a suggestion.
      run: |
        dart run melos:melos run coverage:measure --no-select &&
        dart run tool/coverage_floor.dart --update

    # ----------------------------------------------------------------- perf --
    perf:measure:
      description: >-
        Drive the app and record frame timings to
        flutter_full_stack_flutter/build/perf_report.json. Needs a device.
        PERF_DEVICE picks it when more than one is attached; PERF_MODE
        defaults to profile, which is the only mode whose numbers mean
        anything - and which the iOS simulator does not support, so measuring
        there needs PERF_MODE=debug and gives numbers comparable only to other
        debug runs.
        --no-dds is not optional: `watchPerformance` connects to the VM
        service from inside the app, and with the Dart Development Service in
        front of it the app dials a port that is not forwarded. It fails only
        where the app and the host are different machines, so an iOS
        simulator hides it and an Android emulator does not.
      exec: flutter drive --no-dds --driver=test_driver/perf_driver.dart --target=integration_test/perf_test.dart --${PERF_MODE:-profile} ${PERF_DEVICE:+-d $PERF_DEVICE}
      packageFilters:
        scope: flutter_full_stack_flutter

    perf:
      description: >-
        Measure, then fail if any frame metric drifted past the baseline in
        tool/perf_baseline.json. PERF_TAG names the baseline entry, so an
        emulator's numbers are never compared against a phone's.
      run: |
        dart run melos:melos run perf:measure --no-select &&
        dart run tool/perf_budget.dart --tag ${PERF_TAG:-local}

    perf:baseline:
      description: >-
        Measure, then record the result as the baseline for this device and
        build mode. Commit the diff, and say what moved the numbers.
      run: |
        dart run melos:melos run perf:measure --no-select &&
        dart run tool/perf_budget.dart --update --tag ${PERF_TAG:-local}

    # ---------------------------------------------------------------- evals --
    eval:claims:
      description: >-
        Fails if a SKILL.md names a file, symbol or melos script that no longer
        exists. Deterministic and about a second warm, so it is part of
        `check`: a skill is read literally by an agent, so a renamed class in
        one is not stale prose, it is code that cannot compile.
      run: dart run tool/eval_skill_claims.dart

    eval:skills:
      description: >-
        Runs each skill end to end: a real prompt to `claude -p` in a
        throwaway git worktree, then assertions on what it produced - the
        controller, the route, the translations, regenerated code, analyze and
        the widget tests. Costs minutes and real money, so it is NOT part of
        `check`. Run it after editing a skill. `--budget-usd N` caps the
        spend, `--keep` leaves the worktree to inspect, and a bare argument
        selects one skill by name.
      run: dart run tool/eval_skills.dart

    # ------------------------------------------------------------------ ci --
    check:
      description: Full quality gate - the same checks CI runs.
      run: |
        dart run melos:melos run format:check --no-select &&
        dart run melos:melos run analyze --no-select &&
        dart run melos:melos run eval:claims --no-select &&
        dart run melos:melos run test --no-select

    # ---------------------------------------------------------------- clean --
    clean:
      description: Clean build artifacts of every package.
      exec: flutter clean
      packageFilters:
        flutter: true
