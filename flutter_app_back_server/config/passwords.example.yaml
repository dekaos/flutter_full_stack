# Template for `config/passwords.yaml`, which is git-ignored.
#
#   cp config/passwords.example.yaml config/passwords.yaml
#
# Then fill in the placeholders below.
#
# For `development` and `test`, the `database` and `redis` values are not
# secrets: they only have to match the passwords already declared in
# `docker-compose.yaml`, so that every developer talks to the same local
# containers. Copy them from there:
#
#   development.database  <- services.postgres.environment.POSTGRES_PASSWORD
#   development.redis     <- services.redis.command  (--requirepass ...)
#   test.database         <- services.postgres_test.environment.POSTGRES_PASSWORD
#   test.redis            <- services.redis_test.command  (--requirepass ...)
#
# Every other value is a real secret. Generate a fresh one per entry with:
#
#   openssl rand -base64 32
#
# For staging and production, prefer injecting secrets at runtime through
# SERVERPOD_PASSWORD_<name> environment variables, which take precedence over
# this file. Keep the placeholders here so the file documents what is required.

shared:
  mySharedPassword: 'REPLACE_ME'

development:
  database: 'COPY_FROM_docker-compose.yaml'
  redis: 'COPY_FROM_docker-compose.yaml'

  # The service secret is used to communicate between servers and to access
  # the service protocol.
  serviceSecret: 'REPLACE_ME'

  emailSecretHashPepper: 'REPLACE_ME'
  jwtHmacSha512PrivateKey: 'REPLACE_ME'
  jwtRefreshTokenHashPepper: 'REPLACE_ME'

test:
  database: 'COPY_FROM_docker-compose.yaml'
  redis: 'COPY_FROM_docker-compose.yaml'

  serviceSecret: 'REPLACE_ME'
  emailSecretHashPepper: 'REPLACE_ME'
  jwtHmacSha512PrivateKey: 'REPLACE_ME'
  jwtRefreshTokenHashPepper: 'REPLACE_ME'

staging:
  database: 'REPLACE_ME'
  serviceSecret: 'REPLACE_ME'
  emailSecretHashPepper: 'REPLACE_ME'
  jwtHmacSha512PrivateKey: 'REPLACE_ME'
  jwtRefreshTokenHashPepper: 'REPLACE_ME'

production:
  database: 'REPLACE_ME'
  serviceSecret: 'REPLACE_ME'
  emailSecretHashPepper: 'REPLACE_ME'
  jwtHmacSha512PrivateKey: 'REPLACE_ME'
  jwtRefreshTokenHashPepper: 'REPLACE_ME'
