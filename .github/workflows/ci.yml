name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with the `environment:` constraints in the pubspecs.
  FLUTTER_VERSION: '3.47.2'
  # Keep in sync with the serverpod dependency versions in the pubspecs.
  SERVERPOD_VERSION: '3.4.13'

jobs:
  static:
    name: Format & analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # A single resolve at the root covers every package in the Dart workspace.
      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart run melos:melos run format:check --no-select

      - name: Analyze
        run: dart run melos:melos run analyze --no-select

  codegen:
    name: Generated code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install Serverpod CLI
        run: dart pub global activate serverpod_cli ${{ env.SERVERPOD_VERSION }}

      - name: Regenerate everything
        run: dart run melos:melos run generate --no-select

      # If this fails, someone changed a model/endpoint/provider and committed
      # without running `melos run generate`.
      #
      # `git status --porcelain`, not `git diff`: a brand-new model produces an
      # untracked generated file, which `git diff` does not report at all.
      - name: Fail if generated code differs from what is committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated code is stale. Run 'melos run generate' and commit the result."
            git status --short
            git diff
            exit 1
          fi
          echo "Generated code is up to date."

  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      # These are not secrets: they must match the passwords declared in
      # flutter_full_stack_server/docker-compose.yaml for the *_test containers,
      # and they only ever reach throwaway CI containers.
      SERVERPOD_PASSWORD_database: 'UlVYeCzhThNZR0dMEXY7GyvIQfakUNEY'
      SERVERPOD_PASSWORD_redis: 'OMp1cvgmgWdN2s4eRYn64LTC7nRSIA76'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Start Postgres and Redis
        working-directory: flutter_full_stack_server
        run: docker compose up --quiet-pull --detach

      - name: Run tests
        run: dart run melos:melos run test --no-select

      - name: Stop containers
        if: always()
        working-directory: flutter_full_stack_server
        run: docker compose down --volumes

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    env:
      # Not secrets: these must match the passwords declared in
      # flutter_full_stack_server/docker-compose.yaml for the development
      # containers, which is the database the server runs against here.
      SERVERPOD_PASSWORD_database: 'zwJn_TdUW1zT7guIGhV9IysOK1jvN7WA'
      SERVERPOD_PASSWORD_redis: 'SbeYXujuQnkIwuWLJXNgN0Wi0E_PoaVS'
      E2E_DEVICE: linux
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # integration_test refuses to run on web devices ("Web devices are not
      # supported for integration tests yet"), so the app is driven as a Linux
      # desktop build under a virtual display.
      # clang, cmake and pkg-config happen to be preinstalled on the GitHub
      # runner image, but listing them keeps this job independent of that.
      # gtk+-3.0, glib-2.0 and gio-2.0 are the pkg-config libraries Flutter's
      # Linux doctor actually checks for; xvfb supplies the virtual display.
      - name: Install the Linux desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            xvfb

      - run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      # config/passwords.yaml is git-ignored, and the server aborts at start-up
      # without the auth peppers (PasswordNotFoundException). They are
      # throwaways guarding a throwaway database, so mint fresh ones per run
      # rather than committing fake secrets.
      - name: Mint throwaway auth secrets
        run: |
          for name in serviceSecret emailSecretHashPepper \
                      jwtHmacSha512PrivateKey jwtRefreshTokenHashPepper; do
            echo "SERVERPOD_PASSWORD_$name=$(openssl rand -base64 32)" \
              >> "$GITHUB_ENV"
          done

      - name: Start Postgres and Redis
        working-directory: flutter_full_stack_server
        run: docker compose up --quiet-pull --detach

      - name: Start the Serverpod server
        working-directory: flutter_full_stack_server
        run: nohup dart bin/main.dart --apply-migrations > /tmp/serverpod.log 2>&1 &

      - name: Wait for the API to answer
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:8080/; then
              echo "API answered after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::The server did not answer on :8080 within 60s"
          exit 1

      - name: Run the end-to-end tests
        run: xvfb-run -a dart run melos:melos run test:e2e --no-select

      # Without this, a failure above shows only the Flutter side of the story.
      - name: Server log
        if: failure()
        run: cat /tmp/serverpod.log

      - name: Stop containers
        if: always()
        working-directory: flutter_full_stack_server
        run: docker compose down --volumes
