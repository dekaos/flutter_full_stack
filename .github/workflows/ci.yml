name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with the `environment:` constraints in the pubspecs.
  FLUTTER_VERSION: '3.47.2'
  # Keep in sync with the serverpod dependency versions in the pubspecs.
  SERVERPOD_VERSION: '4.0.0-rc.2'

jobs:
  static:
    name: Format & analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # A single resolve at the root covers every package in the Dart workspace.
      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart run melos:melos run format:check --no-select

      - name: Analyze
        run: dart run melos:melos run analyze --no-select

  codegen:
    name: Generated code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install Serverpod CLI
        run: dart pub global activate serverpod_cli ${{ env.SERVERPOD_VERSION }}

      # `dart pub global activate` installs into ~/.pub-cache/bin, which is not
      # on the runner's PATH. The generate:server script calls `serverpod`
      # directly, so without this it fails with "serverpod: not found" - the
      # same way the composite scripts used to fail on `melos`.
      - name: Put globally activated executables on PATH
        run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Regenerate everything
        run: dart run melos:melos run generate --no-select

      # If this fails, someone changed a model/endpoint/provider and committed
      # without running `melos run generate`.
      #
      # `git status --porcelain`, not `git diff`: a brand-new model produces an
      # untracked generated file, which `git diff` does not report at all.
      - name: Fail if generated code differs from what is committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated code is stale. Run 'melos run generate' and commit the result."
            git status --short
            git diff
            exit 1
          fi
          echo "Generated code is up to date."

  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      # These are not secrets: they must match the passwords declared in
      # flutter_full_stack_server/docker-compose.yaml for the *_test containers,
      # and they only ever reach throwaway CI containers.
      SERVERPOD_PASSWORD_database: 'UlVYeCzhThNZR0dMEXY7GyvIQfakUNEY'
      SERVERPOD_PASSWORD_redis: 'OMp1cvgmgWdN2s4eRYn64LTC7nRSIA76'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Start Postgres and Redis
        working-directory: flutter_full_stack_server
        run: docker compose up --quiet-pull --detach

      - name: Run tests
        run: dart run melos:melos run test --no-select

      - name: Stop containers
        if: always()
        working-directory: flutter_full_stack_server
        run: docker compose down --volumes

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    env:
      # Not secrets: these must match the passwords declared in
      # flutter_full_stack_server/docker-compose.yaml for the development
      # containers, which is the database the server runs against here.
      SERVERPOD_PASSWORD_database: 'zwJn_TdUW1zT7guIGhV9IysOK1jvN7WA'
      SERVERPOD_PASSWORD_redis: 'SbeYXujuQnkIwuWLJXNgN0Wi0E_PoaVS'
      # `adb reverse` (see the emulator step) forwards the device's own
      # localhost:8080 to the host's, so the app uses the same URL here as it
      # does on a developer machine.
      #
      # Not 10.0.2.2, which is the documented alias for the host loopback: on
      # current emulator images traffic goes over the emulated Wi-Fi stack
      # ("Netsim Wifi" in the emulator log) and that alias belongs to the radio
      # NIC, so it is frequently unroutable. `adb reverse` does not care which
      # interface is up.
      E2E_SERVER_URL: 'http://localhost:8080/'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # integration_test refuses to run on web devices ("Web devices are not
      # supported for integration tests yet") and the desktop targets are
      # gone, so the suite needs a real Android emulator. iOS would mean a
      # macos runner; Android is the cheap half of the pair.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The emulator is unusably slow without hardware acceleration, and KVM
      # is present on the ubuntu runners but not world-accessible by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # compileSdk is pinned to 37 (see android/app/build.gradle.kts), which is
      # newer than what the runner image ships, so the platform has to be
      # fetched. This action is what makes that possible: it accepts the SDK
      # licences and puts cmdline-tools on PATH.
      #
      # It deliberately does not install the platform itself. `sdkmanager
      # "platforms;android-37"` would need the exact package id, and Android's
      # move to minor-versioned platforms (android-37.0, 37.1, …) makes that a
      # guess. Gradle knows precisely what `compileSdk = 37` requires, and with
      # the licences accepted it downloads it without being told.
      - uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: flutter pub get

      # config/passwords.yaml is git-ignored, and the server aborts at start-up
      # without the auth peppers (PasswordNotFoundException). They are
      # throwaways guarding a throwaway database, so mint fresh ones per run
      # rather than committing fake secrets.
      - name: Mint throwaway auth secrets
        run: |
          for name in serviceSecret emailSecretHashPepper \
                      jwtHmacSha512PrivateKey jwtRefreshTokenHashPepper; do
            echo "SERVERPOD_PASSWORD_$name=$(openssl rand -base64 32)" \
              >> "$GITHUB_ENV"
          done

      - name: Start Postgres and Redis
        working-directory: flutter_full_stack_server
        run: docker compose up --quiet-pull --detach

      - name: Start the Serverpod server
        working-directory: flutter_full_stack_server
        run: nohup dart bin/main.dart --apply-migrations > /tmp/serverpod.log 2>&1 &

      - name: Wait for the API to answer
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:8080/; then
              echo "API answered after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::The server did not answer on :8080 within 60s"
          exit 1

      # The action boots the emulator, waits for it to come up, runs `script`
      # against it and tears it down. E2E_DEVICE is left unset on purpose: the
      # emulator is the only attached device, so Flutter selects it.
      #
      # `adb reverse` has to happen after the emulator is up, which is why it
      # lives in the script rather than in a step of its own. The --list is
      # there so a future failure says whether the tunnel was actually open.
      - name: Run the end-to-end tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: |
            adb reverse tcp:8080 tcp:8080
            adb reverse --list
            dart run melos:melos run test:e2e --no-select

      # Without this, a failure above shows only the Flutter side of the story.
      # Tolerant of the log not existing: when the job fails before the server
      # starts, this step would otherwise add a second, meaningless red X.
      - name: Server log
        if: failure()
        run: cat /tmp/serverpod.log || echo 'The server never started.'

      - name: Stop containers
        if: always()
        working-directory: flutter_full_stack_server
        run: docker compose down --volumes
