[project]
name = "pronuncia-gop"
version = "0.1.0"
description = "Scoring de pronuncia (EN/ES) por GOP com wav2vec2 + alinhamento forcado"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.2",
    "torchaudio>=2.2",
    "transformers>=4.40",
    "soundfile>=0.12",
    "numpy>=1.26",
    "huggingface-hub>=0.26",
]

[dependency-groups]
export = [
    "onnx>=1.17",
 "onnxruntime>=1.20",
 "onnxscript>=0.1",
 "optimum[onnxruntime]>=1.24",
]

[project.scripts]
gop = "gop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gop"]
